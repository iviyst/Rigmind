# Default gitleaks rules plus an explicit Anthropic key rule.
[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[allowlist]
description = "Placeholders in docs and UI"
regexes = ['''sk-ant-…''', '''sk-ant-\.\.\.''']
